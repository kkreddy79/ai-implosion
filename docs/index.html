<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI Implosion Dashboard</title>
<meta name="description" content="Daily AI-bubble stress score (0–100) across AI-cycle drawdowns and high-yield credit spreads. By KK Reddy.">
<style>
:root {
  --ink:#16151b; --muted:#686873; --cream:#fbf8f1; --paper:#fff; --line:#e9e4dc;
  --red:#EF4444; --orange:#D97706; --orangeRed:#EA580C; --green:#16A34A; --indigo:#6366F1; --amber:#F59E0B; --teal:#14B8A6; --slate:#1E293B;
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, Helvetica, sans-serif;
  --shadow: 0 16px 50px rgba(45,35,20,.08);
}
* { box-sizing: border-box; }
body { margin:0; background:var(--cream); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; font-variant-numeric: lining-nums; }
main { max-width:1260px; margin:auto; padding:28px 16px 60px; }
.eyebrow { text-transform:uppercase; letter-spacing:2px; font-size:12px; color:#b84a17; font-weight:800; }
h1 { font-family:var(--serif); font-size:clamp(34px,6vw,58px); line-height:1; margin:10px 0 8px; letter-spacing:-1px; color:var(--slate); }
.lede { margin:0; color:var(--muted); font-size:16px; }
.note { margin:12px 8px 0 0; display:inline-block; background:#FEF2F2; color:#B91C1C; border:1px solid #FECACA; border-radius:8px; padding:8px 12px; font-weight:700; font-size:14px; }
.kpis { display:grid; grid-template-columns:1.3fr repeat(4,1fr); gap:12px; margin:22px 0 8px; }
.card { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); display:flex; flex-direction:column; justify-content:center; min-height:120px; }
.gaugeCard { align-items:center; }
.label { font-size:11px; text-transform:uppercase; letter-spacing:1.2px; font-weight:800; color:var(--muted); }
.value { font-size:22px; font-weight:800; color:var(--slate); margin:8px 0 4px; line-height:1.15; }
.valueSm { font-size:18px; font-weight:800; color:var(--slate); margin:8px 0 4px; }
.sub { font-size:12.5px; color:var(--muted); margin:0; }
.gauge { width:100%; max-width:210px; }
h2 { font-family:var(--serif); font-size:28px; margin:34px 0 12px; }
h3 { font-size:13px; text-transform:uppercase; letter-spacing:1.2px; margin:4px 0 10px; color:var(--slate); }
.tableWrap { overflow-x:auto; background:var(--paper); border:1px solid var(--line); border-radius:14px; }
table { width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums; }
th { background:var(--slate); color:#fff; font-size:11px; text-transform:uppercase; letter-spacing:.6px; padding:9px 10px; text-align:right; white-space:nowrap; }
th small { font-weight:500; text-transform:none; letter-spacing:0; opacity:.8; }
th:first-child, td:first-child { text-align:left; }
td { padding:9px 10px; border-top:1px solid var(--line); text-align:right; white-space:nowrap; }
.metric { font-weight:700; }
.stale { display:block; color:#B91C1C !important; font-weight:700 !important; }
.w { display:block; font-size:10.5px; color:var(--muted); }
.metric small { display:block; font-weight:500; color:var(--muted); font-size:11px; }
.bar { display:inline-block; width:56px; height:8px; background:#EEF0F6; border-radius:4px; margin-right:8px; vertical-align:middle; overflow:hidden; }
.bar span { display:block; height:100%; background:var(--indigo); }
.pill { display:inline-block; font-size:11px; font-weight:800; letter-spacing:.5px; border-radius:999px; padding:3px 9px; background:#EEF0F6; color:var(--muted); }
.TRIGGERED { background:var(--red); color:#fff; } .WARNING { background:#FED7AA; color:#9A3412; }
.WATCH { background:#FEF9C3; color:#854D0E; } .CALM { background:#DCFCE7; color:#166534; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
.panel { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:16px; }
.grid2 .panel { margin:0; min-width:0; overflow-x:auto; }
.panel td, .panel th { padding:8px 6px; }
.panel svg { width:100%; height:auto; display:block; }
.axis { font:600 11px var(--sans); fill:#686873; }
.legend { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-top:6px; }
.legend i { display:inline-block; width:14px; height:4px; border-radius:2px; margin-right:6px; vertical-align:middle; }
.hbars { display:grid; gap:9px; }
.hbar { display:grid; grid-template-columns:46px 1fr 42px; align-items:center; gap:10px; font-size:13px; font-weight:700; }
.hbar b { text-align:right; font-variant-numeric:tabular-nums; }
.track { height:14px; background:#EEF0F6; border-radius:4px; overflow:hidden; }
.track span { display:block; height:100%; border-radius:4px; background:var(--indigo); }
.how { margin-top:26px; font-size:14px; line-height:1.6; color:#3f3f46; }
.button { display:inline-flex; padding:12px 20px; border-radius:999px; background:#35205f; color:#fff; font-weight:800; font-size:14px; text-decoration:none; margin:6px 0 10px; }
.button.alt { background:#fff; color:var(--ink); border:1px solid var(--line); }
.callout { margin:16px 0 0; background:#FFF7ED; border:1px solid #FED7AA; border-left:5px solid #D97706; border-radius:10px; padding:12px 14px; font-size:14.5px; line-height:1.5; color:#7C2D12; }
.callout b { color:#9A3412; }
details.formulas { margin-top:12px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px 14px; }
details.formulas summary { cursor:pointer; font-weight:800; color:var(--slate); }
.why td { white-space:normal; vertical-align:top; text-align:left; }
.why th { text-align:left; }
.tableWrap > table:not(.why) td, .tableWrap > table:not(.why) th { padding:8px 7px; }
.why td.r { white-space:nowrap; }
.fine { font-size:12px; color:var(--muted); }
footer { margin-top:30px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
.err { padding:40px 0; color:var(--red); font-weight:700; }
@media (max-width:900px) { .kpis { grid-template-columns:1fr 1fr; } .gaugeCard { grid-column:1/-1; } .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main id="app"><p class="lede">Loading the latest data…</p></main>
<script>
(function () {
  var C = { red:"#EF4444", orange:"#D97706", orangeRed:"#EA580C", green:"#16A34A", indigo:"#6366F1", amber:"#F59E0B", teal:"#14B8A6", slate:"#1E293B" };
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function fmtDate(iso, year) {
    if (!iso) return "—";
    var p = iso.split("-").map(Number);
    return String(p[2]).padStart(2, "0") + "-" + MON[p[1] - 1] + (year === false ? "" : "-" + p[0]);
  }
  function num(v, dp) { dp = dp == null ? 2 : dp; return v.toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp }); }
  function pct(v, dp) { return (v * 100).toFixed(dp || 0) + "%"; }
  function scoreColor(v) { return v == null ? C.slate : v >= 75 ? C.red : v >= 50 ? C.orangeRed : v >= 25 ? C.orange : C.green; }

  function gauge(score) {
    var v = Math.max(0, Math.min(100, score == null ? 0 : score)), r = 80, cx = 100, cy = 96;
    var a = Math.PI * (1 - v / 100), x = cx + r * Math.cos(a), y = cy - r * Math.sin(a);
    return '<svg viewBox="0 0 200 112" class="gauge" role="img" aria-label="Stress score ' + (score == null ? "n/a" : score) + ' out of 100">' +
      '<path d="M ' + (cx - r) + ' ' + cy + ' A ' + r + ' ' + r + ' 0 0 1 ' + (cx + r) + ' ' + cy + '" fill="none" stroke="#E2E8F0" stroke-width="18"/>' +
      (v > 0 ? '<path d="M ' + (cx - r) + ' ' + cy + ' A ' + r + ' ' + r + ' 0 0 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + '" fill="none" stroke="' + scoreColor(score) + '" stroke-width="18"/>' : "") +
      '<text x="' + cx + '" y="' + (cy - 12) + '" text-anchor="middle" style="font:800 38px var(--sans)" fill="' + scoreColor(score) + '">' + (score == null ? "—" : score) + '</text>' +
      '<text x="' + cx + '" y="' + (cy + 10) + '" text-anchor="middle" style="font:600 11px var(--sans)" fill="#686873">out of 100</text></svg>';
  }

  function grid(L, R, W, ys) {
    return [0, 25, 50, 75, 100].map(function (g) {
      return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + ys(g) + '" y2="' + ys(g) + '" stroke="#E9E4DC"/>' +
        '<text x="' + (L - 6) + '" y="' + (ys(g) + 4) + '" text-anchor="end" class="axis">' + g + '</text>';
    }).join("");
  }

  function lineChart(H) {
    var W = 720, Ht = 240, L = 34, R = 10, T = 10, B = 26;
    function xs(i) { return L + (i / Math.max(1, H.length - 1)) * (W - L - R); }
    function ys(v) { return T + (1 - v / 100) * (Ht - T - B); }
    var series = [["equity","Equity",C.indigo,1.6],["financing","Financing",C.amber,1.6],["credit","Credit",C.teal,1.6],["score","Score",C.red,3]];
    var paths = series.map(function (s) {
      var d = "", pen = false;
      H.forEach(function (p, i) { var v = p[s[0]]; if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + xs(i).toFixed(1) + "," + ys(v).toFixed(1) + " "; pen = true; });
      return '<path d="' + d + '" fill="none" stroke="' + s[2] + '" stroke-width="' + s[3] + '" stroke-linejoin="round"/>';
    }).join("");
    var ticks = "", n = 0;
    H.forEach(function (p, i) {
      if (i === 0 || p.date.slice(5, 7) !== H[i - 1].date.slice(5, 7)) {
        if (n++ % 2 === 0) ticks += '<text x="' + xs(i) + '" y="' + (Ht - 6) + '" text-anchor="middle" class="axis">' + MON[Number(p.date.slice(5, 7)) - 1] + '</text>';
      }
    });
    return '<div class="panel"><h3>Pillars &amp; score — last 52 weeks</h3><svg viewBox="0 0 ' + W + ' ' + Ht + '" role="img" aria-label="Pillar stress and score over 52 weeks">' +
      grid(L, R, W, ys) + ticks + paths + '</svg><div class="legend">' +
      series.map(function (s) { return '<span><i style="background:' + s[2] + '"></i>' + s[1] + '</span>'; }).join("") + '</div></div>';
  }

  function weeklyChart(Wk) {
    var W = 720, Ht = 220, L = 34, R = 10, T = 10, B = 26, bw = (W - L - R) / Wk.length;
    function ys(v) { return T + (1 - v / 100) * (Ht - T - B); }
    var bars = Wk.map(function (w, i) {
      var out = "";
      if (w.high != null) out += '<rect x="' + (L + i * bw + bw * .15) + '" width="' + (bw * .7) + '" y="' + ys(w.high) + '" height="' + Math.max(0, ys(0) - ys(w.high)) + '" rx="2" fill="' + scoreColor(w.high) + '"><title>Week ending ' + fmtDate(w.weekEnding) + ': ' + w.high + '</title></rect>';
      if (i % 4 === 0) out += '<text x="' + (L + i * bw + bw / 2) + '" y="' + (Ht - 6) + '" text-anchor="middle" class="axis">' + fmtDate(w.weekEnding, false) + '</text>';
      return out;
    }).join("");
    return '<div class="panel"><h3>Weekly high score — 26 weeks</h3><svg viewBox="0 0 ' + W + ' ' + Ht + '" role="img" aria-label="Weekly high stress score over 26 weeks">' + grid(L, R, W, ys) + bars + '</svg></div>';
  }

  function factorRow(f) {
    var dd = f.type === "DD";
    var head = '<td class="metric">' + esc(f.name) + '<small>' + f.col + ' · ' + f.pillar + '</small>' +
      (f.stale ? '<small class="stale">⚠ stale since ' + fmtDate(f.lastDate) + '</small>' : (f.lastDate ? '<small>as of ' + fmtDate(f.lastDate) + '</small>' : '')) +
      '</td><td>' + pct(f.weight) + '</td>';
    var calmTrig = dd ? '<td>' + pct(f.calm) + '</td><td>' + pct(f.trigger) + '</td>'
      : '<td>' + f.calm + '<small class="w">+' + f.wcalm + '</small></td><td>' + f.trigger + '<small class="w">+' + f.wtrig + '</small></td>';
    if (f.current == null || f.ref == null || f.move == null)
      return '<tr>' + head + '<td>—</td><td>—</td><td>—</td>' + calmTrig + '<td>—</td><td>—</td><td>0.0</td><td><span class="pill">NO DATA</span></td></tr>';
    return '<tr>' + head +
      '<td>' + (dd ? num(f.ref) : num(f.ref, 0)) + '</td><td>' + (dd ? num(f.current) : num(f.current, 0)) + '</td>' +
      '<td>' + (dd ? pct(f.move, 1) : (f.move >= 0 ? "+" : "") + num(f.move, 0)) + '</td>' + calmTrig +
      '<td>' + (dd ? num(f.triggerPrice || 0) : (f.band ? esc(f.band) : "—")) + '</td>' +
      '<td><span class="bar"><span style="width:' + pct(f.stress, 1) + '"></span></span>' + pct(f.stress) +
        (dd ? '' : '<small class="w">level ' + pct(f.levelStress) + ' · widen ' + pct(f.widenStress) + ' → ' + (f.widenStress > f.levelStress ? 'widening' : 'level') + ' rule</small>') + '</td>' +
      '<td><b>' + f.points.toFixed(1) + '</b><small class="w">of ' + f.maxPoints.toFixed(0) + '</small></td>' +
      '<td><span class="pill ' + f.status + '">' + f.status + '</span></td></tr>';
  }

  function plus10(f) {
    var p = f.plus10;
    if (!p) return f.points >= f.maxPoints - 0.05 ? 'Already at its maximum' : "Can't add 10 on its own (at most +" + (f.maxPoints - f.points).toFixed(1) + ')';
    if (p.kind === "price") return 'Falls to ' + pct(p.drawdown, 1) + ' from its 2-year high (about ' + num(p.price) + ')';
    return 'Spread reaches ' + num(p.bp, 0) + ' bp (' + p.via + ' rule)';
  }

  function plainEnglish(d) {
    var pw = {};
    d.factors.forEach(function (f) { pw[f.pillar] = (pw[f.pillar] || 0) + f.weight; });
    var spreads = d.factors.filter(function (f) { return f.type === "LVL" && f.current != null; });
    var ex = spreads.sort(function (a, b) { return b.stress - a.stress; })[0], exTxt = "";
    if (ex && ex.stress > 0) {
      var wid = ex.widenStress >= ex.levelStress;
      exTxt = '<p><b>Today’s example:</b> the ' + esc(ex.name.replace(" (bp)", "")) + ' is ' + num(ex.current, 0) + ' bp. ' +
        (wid ? 'That is ' + num(ex.move, 0) + ' bp above its 52-week low of ' + num(ex.ref, 0) + ', a fast climb: widening stress = (' + num(ex.move, 0) + ' − ' + ex.wcalm + ') ÷ (' + ex.wtrig + ' − ' + ex.wcalm + ') = ' + pct(ex.widenStress) +
               ', more than its level reading of ' + pct(ex.levelStress) + ', so it counts ' + pct(ex.stress) + '.'
             : 'Measured against its calm (' + ex.calm + ') and trigger (' + ex.trigger + ') levels that is ' + pct(ex.levelStress) + ' stress.') +
        ' With a ' + pct(ex.weight) + ' weight it adds ' + ex.points.toFixed(1) + ' points to the score of ' + d.score + '.</p>';
    }
    return '<p>Every weekday after the US close, the dashboard reads ' + d.factorCount + ' market gauges in three groups: <b>AI stocks</b> (' + pct(pw.Equity) + ' of the score), <b>the money financing the AI build-out</b> (' + pct(pw.Financing) + ') and <b>the wider credit market</b> (' + pct(pw.Credit) + ').</p>' +
      '<p>Each gauge gets a stress reading from 0% (calm) to 100% (crisis level). For stocks and funds it is how far they have fallen from their 2-year high. For credit spreads — the extra interest riskier borrowers pay — it is how high they are, or how fast they have jumped, whichever is worse.</p>' +
      '<p>The <b>stress score</b> is the weighted average of those readings, from 0 to 100. The alarm levels need the score and specific gauges to stay high for <b>5 trading days in a row</b>, so a one-day wobble never counts. <b>L4 “AI Implosion”</b> needs a score of 75+, the Nasdaq-100 down 25% or more, and credit cracking (junk-bond spreads at 500 bp or the private-credit fund down 25%).</p>' + exTxt;
  }

  function render(d) {
    var notes = (d.notes || []).map(function (n) { return '<p class="note">' + esc(n) + '</p>'; }).join("") +
      (d.sample ? '<p class="note">Sample data — illustrative prices, not real markets.</p>' : "");
    document.getElementById("app").innerHTML =
      '<div class="eyebrow">AI bubble stress tracker</div><h1>AI Implosion Dashboard</h1>' +
      '<p class="lede">Equity, AI-financing &amp; credit stress · ' + d.factorCount + ' indicators | Data as of ' + fmtDate(d.asOf) + '</p>' + notes +
      (d.concentrated && d.concentrated.length ? '<div class="callout"><b>Concentrated stress:</b> ' + d.concentrated.map(function (c) { return esc(c.name.replace(" (bp)", "")) + ' at ' + pct(c.stress); }).join(", ") +
        ' while the overall score is ' + d.score + ' and no alarm level is active. One gauge flashing can lead the rest, so it is worth watching.</div>' : '') +
      (d.shock && d.shock.active ? '<div class="callout"><b>Shock flag:</b> the score is ' + d.score + ', at or above ' + d.shock.threshold + ', but no alert level has confirmed. Fast equity sell-offs (like April 2025) can do this without ever holding long enough for a level; it is a heads-up, not an alert.</div>' : '') +
      '<section class="kpis">' +
        '<div class="card gaugeCard"><div class="label">Stress score</div>' + gauge(d.score) +
          (d.scoreRange && d.scoreRange.tight != null ? '<div class="sub" title="Today\u2019s score recomputed with every threshold ' + pct(d.scoreRange.pct) + ' tighter / looser">Range ' + d.scoreRange.loose + '\u2013' + d.scoreRange.tight + ' if thresholds move \u00b1' + pct(d.scoreRange.pct) + '</div>' : '') + '</div>' +
        '<div class="card"><div class="label">Status</div><div class="value" style="color:' + (d.implosionDate ? C.red : scoreColor(d.score)) + '">' + esc(d.band) + '</div><div class="sub">Score band</div></div>' +
        '<div class="card"><div class="label">Triggers</div><div class="value">' + esc(d.triggers) + '</div><div class="sub">indicators at 100% stress</div></div>' +
        '<div class="card"><div class="label">Current level</div><div class="value">' + esc(d.currentLevel) + '</div><div class="sub">needs 5 straight trading days' + (d.shock ? ' · shock flag ' + (d.shock.active ? '<b style="color:' + C.red + '">ON</b>' : 'off') : '') + '</div></div>' +
        '<div class="card"><div class="label">L4 first date</div><div class="valueSm">' + fmtDate(d.implosionDate) + '</div><div class="sub">first L4 streak</div></div>' +
      '</section>' +
      '<h2>Factor detail</h2><div class="tableWrap"><table><thead><tr><th>Metric</th><th>Weight</th><th>2Y high<br><small>(spreads: 52W low)</small></th><th>Current</th><th>Drawdown<br><small>(spreads: +bp vs low)</small></th><th>Calm<br><small>(spreads: widen)</small></th><th>Trigger<br><small>(spreads: widen)</small></th><th>Trigger price<br><small>(HY: band)</small></th><th>Stress</th><th>Score<br><small>points</small></th><th>Status</th></tr></thead><tbody>' +
        d.factors.map(factorRow).join("") + '</tbody></table></div>' +
      '<h2>Why these weights — and what would move the score</h2><div class="tableWrap"><table class="why"><thead><tr><th>Indicator</th><th>Weight</th><th>Points now</th><th>Why it is here</th><th>To add 10 points on its own</th></tr></thead><tbody>' +
        d.factors.map(function (f) { return '<tr><td class="metric">' + esc(f.name) + '<small>' + f.col + ' · ' + f.pillar + '</small></td><td class="r">' + pct(f.weight) + '</td><td class="r">' + f.points.toFixed(1) + '</td><td>' + esc(f.rationale || "") + '</td><td>' + plus10(f) + '</td></tr>'; }).join("") +
      '</tbody></table></div>' +
      '<div class="grid2">' +
        '<div class="panel"><h3>Factor stress (0–100%)</h3><div class="hbars">' +
          d.factors.map(function (f) { return '<div class="hbar"><span>' + f.col + '</span><span class="track"><span style="width:' + pct(f.stress, 1) + '"></span></span><b>' + pct(f.stress) + '</b></div>'; }).join("") +
        '</div></div>' +
        '<div class="panel"><h3>Levels</h3><table><thead><tr><th>Level</th><th>First date</th><th>Active now</th></tr></thead><tbody>' +
          d.levels.map(function (l) { return '<tr><td class="metric">' + l.level + ' ' + esc(l.name) + '</td><td>' + fmtDate(l.firstDate) + '</td><td>' + (l.active ? '<b style="color:' + C.red + '">YES</b>' : l.paused ? '<b>PAUSED</b><small style="display:block;color:#686873">Nasdaq-100 rebounded ' + pct((d.exitRule || {}).rebound || 0.2) + '</small>' : "NO") + '</td></tr>'; }).join("") +
          '</tbody></table><p style="font-size:14px;margin:12px 0 0">AI Implosion date (first L4 streak): <b>' + fmtDate(d.implosionDate) + '</b></p>' +
          '<p style="font-size:12.5px;color:#686873;margin:8px 0 0">Levels are independent tripwires, not a staircase: L4 can fire without L3, and L2 can be skipped. L1–L2 are the early warnings; L3–L4 confirm damage already under way.</p></div>' +
      '</div>' +
      lineChart(d.history) + weeklyChart(d.weekly) +
      '<section class="how"><h3>How it works</h3>' + plainEnglish(d) +
        '<details class="formulas"><summary>The exact formulas</summary>' +
        '<p><b>Prices</b> (Nasdaq-100, semis, AI, data-center, BDC and loan ETFs): drawdown = dividend-adjusted close ÷ highest close of the last 2 years − 1; stress = clamp((x − Calm) ÷ (Trigger − Calm), 0, 1).</p>' +
        '<p><b>Credit spreads</b> (BBB, CCC, high yield, in bp): stress is the higher of a <i>level</i> test (Calm → Trigger) and a <i>widening</i> test (bp above the 52-week low, widen calm → widen trigger), so a fast blow-out registers before spreads reach crisis levels. The Stress column shows both results for each spread.</p>' +
        '<p><b>Score</b> = Σ(weight × stress) ÷ Σ weights × 100, rounded. Each indicator’s points = its weight share × its stress × 100.</p>' +
        '<p>Levels need 5 straight trading days: L1 Score ≥ 50 · L2 Score ≥ 60 + (BIZD ≥ 80% + BKLN ≥ 50%, or CCC ≥ 80%) · L3 Score ≥ 70 + SOX ≥ 83% + AIQ ≥ 80% · L4 Score ≥ 75 + NDX 100% + (HY ≥ 500bp or BIZD 100%). The Implosion date is the first day of the first L4 streak.</p>' +
        '<p><b>Exit rule:</b> an active level pauses once the Nasdaq-100 is ' + pct((d.exitRule || {}).rebound || 0.2) + ' above its lowest close since that level began, so alerts don\u2019t stay lit deep into a recovery. Start dates, including the Implosion date, never move. <b>Shock flag</b> (not a level): score \u2265 ' + ((d.shock || {}).threshold || 60) + ' on a day with no active level.</p>' +
        '</details>' +
        '<p></p><a class="button" href="AI_Implosion_Dashboard.xlsx" download>Download the Excel workbook</a> ' +
        '<a class="button alt" href="backtest.html">How these rules did in past crashes →</a>' +
        '<p class="fine">Prices: Yahoo Finance dividend-adjusted daily closes. Spreads: FRED (ICE BofA BAMLC0A4CBBB, BAMLH0A3HYC, BAMLH0A0HYM2). Updated every weekday after the US close · last run ' + esc(d.generatedAt.replace("T", " ").replace("+00:00", " UTC")) + '.</p>' +
      '</section>' +
      '<footer>Built by KK Reddy · For information only; not financial advice.</footer>';
  }

  fetch("data.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function (e) { document.getElementById("app").innerHTML = '<p class="err">Could not load the latest data (' + esc(e.message) + '). Try again in a minute.</p>'; });
})();
</script>
