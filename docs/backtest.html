<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI Implosion Backtest</title>
<meta name="description" content="How the AI Implosion Dashboard rules would have behaved in past crashes since 1999. By KK Reddy.">
<style>
:root {
  --ink:#16151b; --muted:#686873; --cream:#fbf8f1; --paper:#fff; --line:#e9e4dc;
  --red:#EF4444; --orange:#D97706; --orangeRed:#EA580C; --green:#16A34A; --indigo:#6366F1; --amber:#F59E0B; --teal:#14B8A6; --slate:#1E293B;
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, Helvetica, sans-serif;
  --shadow: 0 16px 50px rgba(45,35,20,.08);
}
* { box-sizing:border-box; }
body { margin:0; background:var(--cream); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; font-variant-numeric:lining-nums; }
main { max-width:1180px; margin:auto; padding:28px 16px 60px; }
a { color:#35205f; }
.eyebrow { text-transform:uppercase; letter-spacing:2px; font-size:12px; color:#b84a17; font-weight:800; }
h1 { font-family:var(--serif); font-size:clamp(32px,6vw,54px); line-height:1.02; margin:10px 0 8px; letter-spacing:-1px; color:var(--slate); }
h2 { font-family:var(--serif); font-size:26px; margin:34px 0 10px; }
h3 { font-size:13px; text-transform:uppercase; letter-spacing:1.2px; margin:4px 0 10px; color:var(--slate); }
.lede { margin:0; color:var(--muted); font-size:16px; line-height:1.5; max-width:820px; }
.note { margin:12px 0 0; display:inline-block; background:#FEF2F2; color:#B91C1C; border:1px solid #FECACA; border-radius:8px; padding:8px 12px; font-weight:700; font-size:14px; }
.kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:20px 0 4px; }
.card { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); }
.label { font-size:11px; text-transform:uppercase; letter-spacing:1.2px; font-weight:800; color:var(--muted); }
.value { font-size:24px; font-weight:800; color:var(--slate); margin:6px 0 2px; }
.sub { font-size:12.5px; color:var(--muted); margin:0; line-height:1.45; }
.panel { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:14px; overflow-x:auto; }
.panel svg { width:100%; height:auto; display:block; }
.axis { font:600 11px var(--sans); fill:#686873; }
table { width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums; }
th { background:var(--slate); color:#fff; font-size:11px; text-transform:uppercase; letter-spacing:.6px; padding:9px 10px; text-align:right; white-space:nowrap; }
th:first-child, td:first-child { text-align:left; }
td { padding:9px 10px; border-top:1px solid var(--line); text-align:right; white-space:nowrap; vertical-align:top; }
td small { display:block; color:var(--muted); font-size:11px; font-weight:500; white-space:normal; }
.ep { font-weight:700; white-space:normal; min-width:180px; }
.hit { font-weight:800; }
.L1 { color:#A16207; } .L2 { color:var(--orange); } .L3 { color:var(--orangeRed); } .L4 { color:var(--red); }
.no { color:#A1A1AA; }
td small.dq { display:inline-block; font-weight:800; border-radius:6px; padding:1px 6px; margin:3px 0 2px; }
.dqReal { background:#DCFCE7; color:#166534 !important; } .dqPartly { background:#FEF9C3; color:#854D0E !important; } .dqMostly { background:#FED7AA; color:#9A3412 !important; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-top:8px; }
.legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-2px; }
.heat td { text-align:center; font-size:12px; padding:7px 6px; }
.prose { font-size:14.5px; line-height:1.65; color:#3f3f46; max-width:860px; }
.prose li { margin:4px 0; }
.button { display:inline-flex; padding:11px 18px; border-radius:999px; background:#35205f; color:#fff; font-weight:800; font-size:14px; text-decoration:none; }
footer { margin-top:30px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
.err { padding:40px 0; color:var(--red); font-weight:700; }
@media (max-width:900px) { .kpis { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<main id="app"><p class="lede">Loading the backtest…</p></main>
<script>
(function () {
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var LC = ["#A16207", "#D97706", "#EA580C", "#EF4444"];
  var LN = ["L1 Warning", "L2 Financing Stress", "L3 Bubble Unwind", "L4 AI Implosion"];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function fd(iso) { if (!iso) return "—"; var p = iso.split("-").map(Number); return String(p[2]).padStart(2, "0") + "-" + MON[p[1] - 1] + "-" + p[0]; }
  function pct(v) { return (v * 100).toFixed(0) + "%"; }
  function t(iso) { return new Date(iso + "T00:00:00Z").getTime(); }

  function timeline(d) {
    var T = d.timeline, W = 1100, H = 300, L = 34, R = 10, Tp = 12, B = 28;
    var t0 = t(T[0].date), t1 = t(T[T.length - 1].date);
    function xs(iso) { return L + (t(iso) - t0) / (t1 - t0) * (W - L - R); }
    function ys(v) { return Tp + (1 - v / 100) * (H - Tp - B); }
    var bands = d.episodes.map(function (e) {
      var a = Math.max(xs(e.from), L), b = Math.min(xs(e.to), W - R);
      return b > a ? '<rect x="' + a + '" y="' + Tp + '" width="' + (b - a) + '" height="' + (H - Tp - B) + '" fill="#6366F1" opacity="0.08"><title>' + esc(e.name) + '</title></rect>' : "";
    }).join("");
    var grid = [0, 25, 50, 75, 100].map(function (g) {
      return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + ys(g) + '" y2="' + ys(g) + '" stroke="#E9E4DC"/><text x="' + (L - 6) + '" y="' + (ys(g) + 4) + '" text-anchor="end" class="axis">' + g + '</text>';
    }).join("");
    var y0 = Number(T[0].date.slice(0, 4)), y1 = Number(T[T.length - 1].date.slice(0, 4)), years = "";
    for (var y = y0 + 1; y <= y1; y++) if (y % (window.innerWidth < 600 ? 4 : 2) === 0)
      years += '<text x="' + xs(y + "-01-01") + '" y="' + (H - 8) + '" text-anchor="middle" class="axis">' + y + '</text>';
    var path = T.map(function (p, i) { return (i ? "L" : "M") + xs(p.date).toFixed(1) + "," + ys(p.score).toFixed(1); }).join(" ");
    var lv = "";
    T.forEach(function (p) { if (p.level) lv += '<rect x="' + (xs(p.date) - 1.5) + '" y="' + (H - B - 8) + '" width="3" height="8" fill="' + LC[p.level - 1] + '"/>'; });
    return '<div class="panel"><h3>Weekly peak stress score, ' + T[0].date.slice(0, 4) + '–' + T[T.length - 1].date.slice(0, 4) + '</h3>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Weekly peak stress score over time with confirmed levels">' + bands + grid + years +
      '<path d="' + path + '" fill="none" stroke="#1E293B" stroke-width="1.4" stroke-linejoin="round"/>' + lv + '</svg>' +
      '<div class="legend"><span><i style="background:#6366F1;opacity:.25"></i>Known sell-off windows</span>' +
      LN.map(function (n, k) { return '<span><i style="background:' + LC[k] + '"></i>' + n + ' confirmed</span>'; }).join("") + '</div></div>';
  }

  function episodes(d) {
    var rows = d.episodes.map(function (e) {
      var cells = e.levels.map(function (l, k) {
        if (!l.date) return '<td class="no">—</td>';
        var rel = l.daysFromPeak >= 0 ? l.daysFromPeak + "d after peak" : (-l.daysFromPeak) + "d before peak";
        return '<td class="hit L' + (k + 1) + '">' + fd(l.date) + '<small>' + rel + '</small></td>';
      }).join("");
      var prox = e.proxyUsed.length ? '<small>Stand-ins used: ' + e.proxyUsed.join(", ") + '</small>' : "";
      var dq = e.dataQuality ? '<small class="dq dq' + e.dataQuality.split(" ")[0] + '">' + esc(e.dataQuality) + (e.standInShare ? ' (' + pct(e.standInShare) + ' of weight)' : '') + '</small>' : '';
      return '<tr><td class="ep">' + esc(e.name) + dq + '<small>' + esc(e.description) + '</small>' + prox + '</td>' +
        '<td>' + pct(e.ndxDrawdown) + '<small>' + fd(e.ndxPeak) + ' → ' + fd(e.ndxTrough) + '</small></td>' +
        '<td>' + (e.maxScore == null ? "—" : '<b>' + e.maxScore + '</b>') + '<small>' + fd(e.maxScoreDate) + '</small></td>' + cells + '</tr>';
    }).join("");
    return '<div class="panel"><table><thead><tr><th>Episode</th><th>Nasdaq-100 fall</th><th>Peak score</th><th>L1</th><th>L2</th><th>L3</th><th>L4</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function outside(d) {
    var o = d.outsideEpisodes;
    if (!o.length) return '<p class="prose">No level was confirmed outside the listed sell-off windows.</p>';
    return '<div class="panel"><table><thead><tr><th>Start</th><th>Level</th><th>Lasted</th><th>Score at start</th></tr></thead><tbody>' +
      o.map(function (x) { var k = Number(x.level.slice(1)); return '<tr><td>' + fd(x.date) + '</td><td class="hit L' + k + '">' + LN[k - 1] + '</td><td>' + x.days + ' trading days</td><td>' + x.score + '</td></tr>'; }).join("") +
      '</tbody></table></div>';
  }

  function heat(d) {
    var c = d.correlation;
    function col(v) { if (v == null) return "#fff"; var a = Math.max(0, v); return "rgba(99,102,241," + (0.08 + a * 0.6).toFixed(2) + ")"; }
    return '<div class="panel"><table class="heat"><thead><tr><th></th>' + c.cols.map(function (x) { return '<th>' + x + '</th>'; }).join("") + '</tr></thead><tbody>' +
      c.matrix.map(function (row, i) {
        return '<tr><td><b>' + c.cols[i] + '</b></td>' + row.map(function (v) { return '<td style="background:' + col(v) + '">' + (v == null ? "—" : v.toFixed(2)) + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table></div>';
  }

  function comparison(d) {
    var c = d.comparison;
    if (!c || c.length < 2) return "";
    var a = c[0], b = c[1];
    var wrow = Object.keys(a.weights).map(function (k) {
      var x = a.weights[k], y = b.weights[k];
      return '<tr><td><b>' + k + '</b></td><td>' + pct(x) + '</td><td>' + pct(y) + (y !== x ? (y > x ? ' ▲' : ' ▼') : '') + '</td></tr>';
    }).join("");
    function stat(lbl, f) { return '<tr><td>' + lbl + '</td><td>' + f(a) + '</td><td>' + f(b) + '</td></tr>'; }
    var l4 = function (v) { var h = v.episodes.filter(function (e) { return e.levels[3].date; }); return h.length + ' of ' + v.episodes.length; };
    var eps = a.episodes.map(function (e, i) {
      var e2 = b.episodes[i];
      function cell(x) { return x.levels.map(function (l, k) { return l.date ? '<span class="L' + (k + 1) + '">' + l.level + '</span>' : '<span class="no">' + l.level + '</span>'; }).join(" "); }
      return '<tr><td class="ep">' + esc(e.name) + '</td><td>' + e.maxScore + ' · ' + cell(e) + '</td><td>' + e2.maxScore + ' · ' + cell(e2) + '</td></tr>';
    }).join("");
    return '<h2>Weighting check: current vs lower-redundancy</h2>' +
      '<p class="prose">Because some indicators move together (see below), an alternative weighting was replayed on the same history. It shifts weight away from indicators that duplicate others (AIQ tracks the Nasdaq; BBB tracks high yield) toward ones that add independent information. The live weights are kept unless the alternative catches the same implosions with no extra false alarms.</p>' +
      '<div class="panel"><table><thead><tr><th>Result</th><th>Current (live)</th><th>Lower-redundancy</th></tr></thead><tbody>' +
        stat('Episodes where L4 fired', l4) +
        stat('False alarms outside sell-offs (L1 · L2 · L3 · L4)', function (v) { return v.outsideByLevel.join(" · "); }) +
        stat('Trading days at each level (L1 · L2 · L3 · L4)', function (v) { return v.daysByLevel.join(" · "); }) +
      '</tbody></table></div>' +
      '<div class="panel"><table><thead><tr><th>Episode</th><th>Current: peak score · levels</th><th>Lower-redundancy: peak score · levels</th></tr></thead><tbody>' + eps + '</tbody></table></div>' +
      '<div class="panel"><table><thead><tr><th>Weight</th><th>Current</th><th>Lower-redundancy</th></tr></thead><tbody>' + wrow + '</tbody></table></div>' +
      '<p class="prose"><b>Verdict:</b> ' + verdict(a, b) + '</p>';
  }

  function verdict(a, b) {
    var hits = function (v) { return v.episodes.filter(function (e) { return e.levels[3].date; }).map(function (e) { return e.name; }).join("|"); };
    var fa = function (v) { return v.outsideByLevel.reduce(function (s, x) { return s + x; }, 0); };
    if (hits(a) === hits(b) && fa(b) > fa(a))
      return 'both weightings flag the same implosions, but the alternative adds ' + (fa(b) - fa(a)) + ' more false alarm' + (fa(b) - fa(a) > 1 ? 's' : '') + ' at lower levels, so the current weights stay.';
    if (hits(a) === hits(b) && fa(b) <= fa(a))
      return 'the alternative flags the same implosions with no extra false alarms, so it is a candidate to adopt.';
    return 'the two weightings flag different implosions; the current weights stay until that is reviewed.';
  }

  function render(d) {
    var hitL4 = d.episodes.filter(function (e) { return e.levels[3].date; }).map(function (e) { return e.name; });
    var falseL4 = d.outsideEpisodes.filter(function (x) { return x.level === "L4"; }).length;
    var pc = d.pillarCorrelation;
    document.getElementById("app").innerHTML =
      '<div class="eyebrow">AI Implosion Dashboard · backtest</div><h1>How the rules did in past crashes</h1>' +
      '<p class="lede">The live rules replayed on daily market data from ' + fd(d.dataStart) + ' to ' + fd(d.dataEnd) +
      '. Scoring starts ' + fd(d.firstScored) + ', after a 2-year warm-up for the rolling highs.</p>' +
      (d.sample ? '<p class="note">Synthetic test data — not real market history.</p>' : "") +
      (d.notes || []).map(function (n) { return '<p class="note">' + esc(n) + '</p>'; }).join("") +
      '<section class="kpis">' +
        '<div class="card"><div class="label">L4 fired in</div><div class="value">' + hitL4.length + ' of ' + d.episodes.length + '</div><p class="sub">' + (hitL4.length ? esc(hitL4.join(", ")) : "no episode") + '</p></div>' +
        '<div class="card"><div class="label">L4 outside episodes</div><div class="value">' + falseL4 + '</div><p class="sub">confirmed L4 streaks outside the known sell-off windows</p></div>' +
        '<div class="card"><div class="label">Streaks by level</div><div class="value" style="font-size:20px">' + d.streaksByLevel.join(" · ") + '</div><p class="sub">L1 · L2 · L3 · L4, each lasting ≥ 5 trading days · ' + d.daysByLevel.join(" / ") + ' trading days at each level since ' + d.firstScored.slice(0, 4) + '</p></div>' +
        '<div class="card"><div class="label">Pillars move together</div><div class="value" style="font-size:20px">' + [pc["eq-fin"], pc["eq-cr"], pc["fin-cr"]].map(function (v) { return v == null ? "—" : v.toFixed(2); }).join(" · ") + '</div><p class="sub">correlation of Equity–Financing · Equity–Credit · Financing–Credit</p></div>' +
      '</section>' +
      timeline(d) +
      '<h2>Episode by episode</h2><p class="prose">First confirmed date for each level inside each sell-off window, and how long after the Nasdaq-100 peak it came. A dash means the level never confirmed.</p>' + episodes(d) +
      '<h2>Alarms outside the known sell-offs</h2><p class="prose">Confirmed levels that started outside the windows above. Some are real stress the list doesn’t name; the rest are false alarms.</p>' + outside(d) +
      comparison(d) +
      '<h2>Do the indicators double-count?</h2><p class="prose">Correlation of daily stress between indicators (1 = always move together), measured only over days when both are real data, not stand-ins. High values inside a pillar mean those weights effectively count one risk more than once.</p>' + heat(d) +
      '<h2>Method and caveats</h2><div class="prose"><ul>' +
        '<li>Same rules, thresholds and weights as the live dashboard (config.json), applied day by day with no look-ahead.</li>' +
        '<li>Prices are dividend-adjusted closes from Yahoo Finance; spreads are ICE BofA option-adjusted spreads from FRED.</li>' +
        '<li>Indicators without full history are back-filled with a stand-in, scaled to join the real series where it begins. This covers ETFs that did not exist yet, and the ICE credit spreads, which FRED only publishes for about the last three years: ' +
          d.proxies.filter(function (p) { return p.until; }).map(function (p) { return '<b>' + esc(p.col) + '</b> ← ' + esc(p.label) + ' (' + fd(p.from) + ' to ' + fd(p.until) + ')'; }).join("; ") +
          '. Before any stand-in exists, that indicator is left out and the weights are re-balanced.</li>' +
        '<li>Every episode before late 2023 relies partly on stand-ins, and the credit-spread stand-in is the broadest one: Baa spreads move with, but less than, high-yield and CCC spreads. Treat older results as indicative, not exact.</li>' +
        '<li>Episode windows are set by hand around well-known sell-offs; their start and end dates are approximate.</li>' +
      '</ul><p><a class="button" href="./">← Back to the live dashboard</a></p></div>' +
      '<footer>Built by KK Reddy · Backtest run ' + esc(d.generatedAt.replace("T", " ").replace("+00:00", " UTC")) + ' · For information only; not financial advice.</footer>';
  }

  fetch("backtest.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function (e) { document.getElementById("app").innerHTML = '<p class="err">The backtest hasn’t been published yet (' + esc(e.message) + '). Check back shortly.</p>'; });
})();
</script>
</body>
</html>
